{# Address fields. Context: values (dict), errors (dict), states (list); optional form_id. #}
{% set fa = ('form="' ~ form_id ~ '"')|safe if form_id else '' %}
{% set v = values or {} %}
{% set e = errors or {} %}
<div class="grid-2">
  <label class="field"><span>Full name</span><input name="full_name" {{ fa }} autocomplete="name" required value="{{ v.get('full_name', '') }}">{% if e.full_name %}<span class="field-error">{{ e.full_name }}</span>{% endif %}</label>
  <label class="field"><span>Mobile number</span><input name="phone" {{ fa }} inputmode="tel" autocomplete="tel-national" maxlength="14" required value="{{ v.get('phone', '') }}" placeholder="10-digit mobile number">{% if e.phone %}<span class="field-error">{{ e.phone }}</span>{% endif %}</label>
</div>
<div class="grid-2">
  <label class="field"><span>PIN code</span><input name="pincode" {{ fa }} inputmode="numeric" autocomplete="postal-code" maxlength="6" pattern="[1-9][0-9]{5}" required value="{{ v.get('pincode', '') }}" placeholder="6 digits [0-9] PIN code" data-pin-autofill>{% if e.pincode %}<span class="field-error">{{ e.pincode }}</span>{% endif %}</label>
  <label class="field"><span>Town / City</span><input name="city" {{ fa }} autocomplete="address-level2" required value="{{ v.get('city', '') }}">{% if e.city %}<span class="field-error">{{ e.city }}</span>{% endif %}</label>
</div>
<label class="field"><span>Flat, house no., building, company, apartment</span><input name="line1" {{ fa }} autocomplete="address-line1" required value="{{ v.get('line1', '') }}">{% if e.line1 %}<span class="field-error">{{ e.line1 }}</span>{% endif %}</label>
<label class="field"><span>Area, street, sector, village</span><input name="line2" {{ fa }} autocomplete="address-line2" value="{{ v.get('line2', '') }}"></label>
<div class="grid-2">
  <label class="field"><span>Landmark <small>(optional)</small></span><input name="landmark" {{ fa }} value="{{ v.get('landmark', '') }}" placeholder="E.g. near Apollo Hospital"></label>
  <label class="field"><span>State</span>
    <select name="state" {{ fa }} autocomplete="address-level1" required>
      <option value="">Choose a state</option>
      {% for s in states %}<option {% if v.get('state') == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>{% if e.state %}<span class="field-error">{{ e.state }}</span>{% endif %}
  </label>
</div>
<fieldset class="field addr-kind">
  <legend>Address type</legend>
  <label class="checkbox"><input type="radio" name="kind" value="home" {{ fa }} {% if v.get('kind', 'home') == 'home' %}checked{% endif %}> Home <small>(all-day delivery)</small></label>
  <label class="checkbox"><input type="radio" name="kind" value="work" {{ fa }} {% if v.get('kind') == 'work' %}checked{% endif %}> Work <small>(10 AM – 6 PM)</small></label>
</fieldset>
<label class="checkbox field"><input type="checkbox" name="is_default" value="1" {{ fa }} {% if address is defined and address and address.is_default %}checked{% endif %}> Make this my default address</label>
