name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests (no API key needed - the LLM is mocked)
        run: uv run pytest -q
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shopcrew:ci .
      - name: Smoke test container (demo mode)
        run: |
          docker run -d --name shopcrew -p 8501:8501 shopcrew:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fs http://localhost:8501/_stcore/health
          docker exec shopcrew shopcrew --product earbuds-01 --quiet
          docker logs shopcrew | tail -20
      - name: Smoke test the Northcart store (seeds its DB on first start)
        run: |
          docker run -d --name northcart -p 8000:8000 shopcrew:ci \
            uvicorn northcart.web.app:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fs http://localhost:8000/ | grep -q "northcart"
          curl -fs http://localhost:8000/p/pulsebeat-pro-wireless-earbuds > /dev/null
          docker logs northcart | tail -20
