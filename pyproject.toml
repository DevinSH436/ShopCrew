[project]
name = "shopcrew"
version = "0.1.0"
description = "A multi-agent AI team (CrewAI) that analyses reviews, tracks prices, writes SEO copy and plans marketing campaigns for an e-commerce store."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[anthropic,litellm]>=1.15,<2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
shopcrew = "shopcrew.main:main"
northcart = "northcart.web.app:main"
northcart-seed = "northcart.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopcrew", "src/northcart"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Data/markup-heavy modules (catalogue text, SVG drawings, seed data).
"src/northcart/{art,catalog_data,seed}.py" = ["E501"]
"src/northcart/services/settings.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation noise from inside crewai itself, not from this project.
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
